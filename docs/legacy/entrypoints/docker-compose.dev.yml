version: '3.8'

services:
  # SYMindX Development Environment
  symindx-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: symindx-dev
    ports:
      - "3000:3000"
      - "8080:8080"
      - "9090:9090"
      - "9229:9229"  # Node.js debugger
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://symindx:dev123@postgres-dev:5432/symindx_dev
      - REDIS_URL=redis://redis-dev:6379
      - LOG_LEVEL=debug
      - MEMORY_PROVIDER=sqlite
      - AI_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - symindx_dev_data:/app/data
    depends_on:
      - postgres-dev
      - redis-dev
    networks:
      - symindx_dev_network
    restart: unless-stopped
    command: ["bun", "dev"]

  # Website Development
  symindx-website-dev:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    container_name: symindx-website-dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ./website:/app
      - /app/node_modules
    networks:
      - symindx_dev_network
    restart: unless-stopped
    command: ["bun", "dev"]

  # Development PostgreSQL
  postgres-dev:
    image: pgvector/pgvector:pg15
    container_name: symindx-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=symindx_dev
      - POSTGRES_USER=symindx
      - POSTGRES_PASSWORD=dev123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/vector-init.sql:/docker-entrypoint-initdb.d/02-vector-init.sql:ro
    networks:
      - symindx_dev_network
    restart: unless-stopped

  # Development Redis
  redis-dev:
    image: redis:7-alpine
    container_name: symindx-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - symindx_dev_network
    restart: unless-stopped

  # Development Monitoring (Optional)
  prometheus-dev:
    image: prom/prometheus:v2.48.0
    container_name: symindx-prometheus-dev
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - symindx_dev_network
    restart: unless-stopped
    profiles:
      - monitoring

  grafana-dev:
    image: grafana/grafana:10.2.0
    container_name: symindx-grafana-dev
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus-dev
    networks:
      - symindx_dev_network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  symindx_dev_data:
  postgres_dev_data:
  redis_dev_data:
  prometheus_dev_data:
  grafana_dev_data:

networks:
  symindx_dev_network:
    driver: bridge