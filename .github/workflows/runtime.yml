name: SYMindX v0.1

on:
  push:
    branches: [main]
    paths:
      - 'packages/runtime/**'
      - 'package.json'
      - '.github/workflows/runtime.yml'
  pull_request:
    paths:
      - 'packages/runtime/**'
      - 'package.json'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install pinned development dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: bun run format:check
      - name: Check strict types
        run: bun run typecheck
      - name: Build library, CLI, and declarations
        run: bun run build