name: SYMindX agent

on:
  push:
    branches: [main]
    paths:
      - 'packages/agent/**'
      - 'packages/orchestration/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - '.github/workflows/runtime.yml'
  pull_request:
    paths:
      - 'packages/agent/**'
      - 'packages/orchestration/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Typecheck the agent package
        run: bun --no-env-file run --cwd packages/agent typecheck
      - name: Typecheck the orchestration package
        run: bun --no-env-file run --cwd packages/orchestration typecheck
