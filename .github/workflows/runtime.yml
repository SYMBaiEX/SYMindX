name: SYMindX v0.1

on:
  push:
    branches: [main]
    paths:
      - 'packages/runtime/**'
      - 'package.json'
      - '.github/workflows/runtime.yml'
  pull_request:
    paths:
      - 'packages/runtime/**'
      - 'package.json'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install pinned development dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: bun run format:check
      - name: Check strict types
        run: bun run typecheck
      - name: Build library, CLI, and declarations
        run: bun run build