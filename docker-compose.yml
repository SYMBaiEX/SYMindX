# Explicit one-shot CLI profile; no deployment or secret loading.
services:
  cli:
    profiles: [cli]
    build:
      context: .
      dockerfile: Dockerfile
    command: [chat, --db, /app/data/symindx.sqlite, --message, Hello]
    volumes:
      - runtime_data:/app/data
    init: true
volumes:
  runtime_data:
